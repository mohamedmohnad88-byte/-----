<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e17"><title>PHYS-LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0e17;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;color:#cfe3f1;font-family:Consolas,"Courier New",monospace}
.bar0{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #22d3ee55;background:#0a0e17ee;position:sticky;top:0;z-index:5}
.bar0 b{color:#ff7a18;letter-spacing:2px}.on1{color:#22d3ee;font-size:12px}.on1:before{content:"●";margin-left:5px;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.2}}
.who{padding:16px}.who h1{margin:0;font-size:22px;color:#fff}.who p{margin:4px 0 0;color:#7f9bb0;font-size:13px}
.tabs{display:flex;gap:8px;padding:0 16px}.tabs a{flex:1;text-align:center;padding:11px 4px;border:1px solid #22d3ee55;color:#7fd8e8;cursor:pointer;font-size:14px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.tabs a.active{background:#ff7a18;color:#0a0e17;border-color:#ff7a18;font-weight:700}
main{padding:18px 16px 30px;max-width:760px;margin:auto}.view{display:none}.view.on{display:block;animation:sl .3s ease both}@keyframes sl{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp{border:1px solid #22d3ee44;background:#101828;padding:14px}.kp b{display:block;direction:ltr;unicode-bidi:isolate;text-align:right;font-size:30px;color:#22d3ee;text-shadow:0 0 12px #22d3ee66}.kp span{font-size:12px;color:#7f9bb0}
.msg{border:1px dashed #ff7a18;color:#ffb27a;padding:16px;margin-bottom:14px;line-height:1.9}
h2{color:#ff7a18;font-size:16px;letter-spacing:1px;margin:20px 0 10px}h2:before{content:"> "}
.row{display:grid;grid-template-columns:78px 1fr 64px;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}.trk{height:14px;background:#17233a;border:1px solid #22d3ee33}.trk i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a18,#ffb27a);box-shadow:0 0 10px #ff7a1888;transition:width 1.1s ease}.row.pend .trk{border-style:dashed;background:none}.row b{color:#fff;text-align:left;direction:ltr;unicode-bidi:isolate}.nm{color:#7fd8e8;display:block;font-size:11px}
.log{border-right:2px solid #22d3ee55;padding-right:14px}.log div{padding:9px 0;border-bottom:1px solid #ffffff10;font-size:13px}.log em{font-style:normal;color:#ff7a18}.ok{color:#4ade80}
footer{text-align:center;color:#47607a;font-size:11px;padding:20px}
@media (prefers-reduced-motion:reduce){.on1:before,.view.on,.trk i{animation:none;transition:none}}
</style></head><body>
<div class="bar0"><b>PHYS·LAB</b><span class="on1">ONLINE</span></div>
<div class="who"><h1>⚛️ الفيزياء</h1><p>أ/ أحمد سعد · الخانكة · السبت 12:00 · الأربعاء 6:00</p><p>STUDENT: مهند محمد عنتر</p></div>
<div class="tabs"><a data-tab="home">HOME</a><a data-tab="att">LOG</a><a data-tab="exams" class="active">EXAMS</a></div>
<main>
<section class="view" id="v-home"><div class="msg">الفيزياء قوانين بتتفهم مش بتتحفظ ⚡<br>كل مسألة بتحلها بتزوّد قوتك، كمّل يا مهند 🚀</div><div class="kpis" id="kp"></div></section>
<section class="view" id="v-att"><h2>ATTENDANCE_LOG</h2><div class="log" id="lg"></div></section>
<section class="view on" id="v-exams"><h2>EXAM_RESULTS</h2><div id="rs"></div></section>
</main><footer>// personal preview · صفحة معاينة شخصية</footer>
<script>var CFG={
 "sessions": [
  "2026-09-16",
  "2026-09-19",
  "2026-09-23",
  "2026-09-26",
  "2026-09-30",
  "2026-10-03",
  "2026-10-07",
  "2026-10-10",
  "2026-10-14",
  "2026-10-17",
  "2026-10-21",
  "2026-10-24"
 ],
 "exams": [
  {
   "d": "2026-10-24",
   "n": "كويز",
   "g": 5,
   "m": 5
  },
  {
   "d": "2026-10-21",
   "n": "كويز",
   "g": 13,
   "m": 15
  },
  {
   "d": "2026-10-17",
   "n": "كويز",
   "g": 12,
   "m": 15
  },
  {
   "d": "2026-10-14",
   "n": "كويز",
   "g": 14,
   "m": 15
  },
  {
   "d": "",
   "n": "امتحان شامل",
   "g": null,
   "m": 50
  }
 ]
};function $(i){return document.getElementById(i);}
function pc(e){return Math.round(e.g/e.m*100);}
function tabs(on){var t=document.querySelectorAll("[data-tab]"),v=document.querySelectorAll(".view");
 function show(n){if(!$("v-"+n)){n="exams";}for(var i=0;i<v.length;i++){v[i].classList.toggle("on",v[i].id==="v-"+n);}for(var j=0;j<t.length;j++){t[j].classList.toggle("active",t[j].getAttribute("data-tab")===n);}window.scrollTo(0,0);}
 for(var k=0;k<t.length;k++){t[k].addEventListener("click",function(){var n=this.getAttribute("data-tab");try{history.replaceState(null,"","#"+n);}catch(e){}show(n);});}
 show((location.hash||"").replace("#","")||on);}
var D=["SUN","MON","TUE","WED","THU","FRI","SAT"];
var ex=CFG.exams.slice().sort(function(a,b){return (b.d||"9999").localeCompare(a.d||"9999");});
$("rs").innerHTML=ex.map(function(e){var p=e.g===null;return '<div class="row'+(p?' pend':'')+'"><span>'+(e.d||"--/--")+'<span class="nm">'+e.n+'</span></span><div class="trk"><i data-w="'+(p?0:pc(e))+'"></i></div><b>'+(p?"PENDING":e.g+"/"+e.m)+'</b></div>';}).join("");
setTimeout(function(){[].forEach.call(document.querySelectorAll(".trk i"),function(i){i.style.width=i.getAttribute("data-w")+"%";});},150);
$("lg").innerHTML=CFG.sessions.slice().reverse().map(function(s){return '<div><em>['+s+']</em> '+D[new Date(s+"T12:00:00").getDay()]+' <span class="ok">✓ حاضر</span></div>';}).join("");
var g=CFG.exams.filter(function(e){return e.g!==null;}),sg=0,sm=0;g.forEach(function(e){sg+=e.g;sm+=e.m;});
function k(v,l){return '<div class="kp"><b>'+v+'</b><span>'+l+'</span></div>';}
$("kp").innerHTML=k(Math.round(sg/sm*100)+"%","AVG_SCORE")+k(CFG.sessions.length+"/"+CFG.sessions.length,"ATTENDANCE")+k("PENDING","FINAL_EXAM")+k(g[0].g+"/"+g[0].m,"LAST_EXAM");
tabs("exams");</script></body></html>
